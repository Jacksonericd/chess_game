name: chess_app
description: "Chess game."
publish_to: 'none'

version: 1.0.5+6

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  firebase_analytics: ^12.6.0
  google_mobile_ads: ^9.1.0
  upgrader: ^13.7.0
  url_launcher: ^6.3.2
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  generate: true

  uses-material-design: true
  assets:
    - assets/icons/app_icon.png
    - assets/store/
    - assets/store/screenshots/
